[project]
name = "oclettings"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1",
    "django-environ>=0.14.0",
    "gunicorn>=26.1.0",
    "sentry-sdk>=2.68.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "pytest-env>=1.7.0",
    "ruff>=0.16.3",
]

[tool.ruff]
target-version = "py312"
line-length = 99
exclude = [
    "**/migrations/*",
    ".venv",
    "venv",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "oc_lettings_site.settings"
python_files = ["test_*.py", "tests.py"]
addopts = "-v"

[tool.pytest_env]
ENVIRONMENT = "test"
